<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Krishi Sahayak – AI Farming Advisor</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="chat-body">
<div class="app-container">
  <div class="chat-header navbar">
    <a href="../" class="chat-header-title" style="text-decoration: none;">
      <span>🌾</span>
      <h1 style="color: #0d6b1c; font-size: 1.2rem; font-weight: 600; margin:0;">Krishi Sahayak</h1>
      <span class="badge" style="background: #0d6b1c; color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 700;">AI</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <div class="nav-links">
      <a href="../">Home</a>
      <a href="../about/">About Us</a>
      <a href="../contact/">Contact Us</a>
    </div>
  </div>
  <div class="lang-bar">
    <select id="language-select">
      <option value="hi">हिन्दी</option>
      <option value="bn">বাংলা</option>
      <option value="te" selected>తెలుగు</option>
      <option value="ta">தமிழ்</option>
      <option value="mr">मराठी</option>
      <option value="gu">ગુજરાતી</option>
      <option value="kn">ಕನ್ನಡ</option>
      <option value="ml">മലയാളം</option>
      <option value="pa">ਪੰਜਾਬੀ</option>
      <option value="or">ଓଡ଼ିଆ</option>
      <option value="as">অসমীয়া</option>
      <option value="ur">اردو</option>
      <option value="sat">ᱥᱟᱱᱛᱟᱲ</option>
      <option value="mai">मैथिली</option>
      <option value="gom">कोंकणी</option>
    </select>
  </div>
  <div class="chat-area" id="chat-container">
    <div class="empty-state" id="empty-state">
      <p>🌱 Your personal farming assistant</p>
      <p>Select language, ask a question (or upload a photo)</p>
    </div>
  </div>
  <div class="typing" id="typing-indicator" style="margin: 0 20px 20px;">
    <div class="dot" style="margin-left: 0;"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="input-area" id="input-area">
    <label for="image-input" class="icon-btn" title="Attach photo">🖼️</label>
    <input type="file" id="image-input" accept="image/*">
    <div id="preview-container"></div>
    <input type="text" id="user-input" placeholder="Ask a farming question..." autocomplete="off">
    <button class="icon-btn send-btn" id="send-btn">➤</button>
  </div>
</div>
<script>
  const BACKEND_URL = 'https://oyster-app-jb6cq.ondigitalocean.app';
  const languageSelect = document.getElementById('language-select');
  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const typingIndicator = document.getElementById('typing-indicator');
  const imageInput = document.getElementById('image-input');
  const previewContainer = document.getElementById('preview-container');
  const emptyState = document.getElementById('empty-state');
  let uploadedImage = null;
  function hideEmptyState() { if (emptyState) emptyState.style.display = 'none'; }
  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function formatInlineMarkdown(value) {
    return escapeHTML(value).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }
  function renderBotReply(text) {
    const normalized = String(text || '').replace(/\r\n/g, '\n').trim();
    const isFertilizerReply = /\b(fertilizer|fertiliser|urea|dap|npk|mop|manure|compost)\b/i.test(normalized);
    const fertilizerLabels = new Set(['fertilizer', 'fertiliser', 'usage', 'use', 'dose', 'dosage', 'quantity', 'method', 'timing', 'precautions', 'application', 'apply']);
    const lines = normalized.split('\n');
    const blocks = [];
    let listItems = [];

    const flushList = () => {
      if (!listItems.length) return;
      blocks.push(`<ul class="response-list">${listItems.map((item) => `<li>${item}</li>`).join('')}</ul>`);
      listItems = [];
    };

    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line) {
        flushList();
        continue;
      }

      const bulletMatch = line.match(/^[-*•]\s+(.*)$/);
      if (bulletMatch) {
        listItems.push(formatInlineMarkdown(bulletMatch[1]));
        continue;
      }

      flushList();

      const labelMatch = line.match(/^([A-Za-z][A-Za-z\s()/+-]{0,30}):\s*(.+)$/);
      if (isFertilizerReply && labelMatch && fertilizerLabels.has(labelMatch[1].trim().toLowerCase())) {
        blocks.push(
          `<div class="fertilizer-row"><span class="fertilizer-label">${escapeHTML(labelMatch[1].trim())}</span><span class="fertilizer-value">${formatInlineMarkdown(labelMatch[2])}</span></div>`
        );
        continue;
      }

      if (/^#{1,3}\s+/.test(line)) {
        blocks.push(`<p class="response-heading">${formatInlineMarkdown(line.replace(/^#{1,3}\s+/, ''))}</p>`);
        continue;
      }

      blocks.push(`<p>${formatInlineMarkdown(line)}</p>`);
    }

    flushList();

    const content = blocks.join('');
    if (isFertilizerReply) {
      return `<div class="fertilizer-card"><div class="fertilizer-chip">Fertilizer guidance</div>${content}</div>`;
    }

    return content;
  }
  function appendMessage(text, sender) {
    hideEmptyState();
    const message = document.createElement('div');
    message.className = `message ${sender === 'user' ? 'user-msg' : 'bot-msg'}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (sender === 'bot') {
      bubble.classList.add('rich-bubble');
      bubble.innerHTML = renderBotReply(text);
    } else {
      bubble.textContent = text;
    }
    message.appendChild(bubble);
    chatContainer.appendChild(message);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }
  function showTyping() { typingIndicator.style.display = 'block'; }
  function hideTyping() { typingIndicator.style.display = 'none'; }
  async function sendMessage() {
    const messageText = userInput.value.trim();
    if (!messageText && !uploadedImage) return;
    appendMessage(messageText || 'Uploaded image', 'user');
    userInput.value = '';
    showTyping();
    try {
      let response;
      if (uploadedImage) {
        const formData = new FormData();
        formData.append('prompt', messageText);
        formData.append('language', languageSelect.value);
        formData.append('image', uploadedImage);
        response = await fetch(`${BACKEND_URL}/chat/image`, { method: 'POST', body: formData });
      } else {
        response = await fetch(`${BACKEND_URL}/chat/text`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: messageText, language: languageSelect.value })
        });
      }
      const data = await response.json();
      hideTyping();
      if (data.response) appendMessage(data.response, 'bot');
      else appendMessage('⚠️ No response received. Try again.', 'bot');
    } catch (err) {
      hideTyping();
      appendMessage('⚠️ Connection error. Check your internet.', 'bot');
    }
  }
  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
<script src="../site.js"></script>
</body>
</html>
