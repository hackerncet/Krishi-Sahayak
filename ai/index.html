<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Krishi Sahayak – AI Farming Advisor</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="chat-body">
<div class="app-container">
  <div class="chat-header navbar">
    <a href="../" class="chat-header-title" style="text-decoration: none;">
      <span>🌾</span>
      <h1 style="color: #0d6b1c; font-size: 1.2rem; font-weight: 600; margin:0;">Krishi Sahayak</h1>
      <span class="badge" style="background: #0d6b1c; color: white; padding: 2px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 700;">AI</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <div class="nav-links">
      <a href="../">Home</a>
      <a href="../about/">About Us</a>
      <a href="../contact/">Contact Us</a>
    </div>
  </div>
  <div class="lang-bar">
    <select id="language-select">
      <option value="hi">हिन्दी</option>
      <option value="bn">বাংলা</option>
      <option value="te" selected>తెలుగు</option>
      <option value="ta">தமிழ்</option>
      <option value="mr">मराठी</option>
      <option value="gu">ગુજરાતી</option>
      <option value="kn">ಕನ್ನಡ</option>
      <option value="ml">മലയാളം</option>
      <option value="pa">ਪੰਜਾਬੀ</option>
      <option value="or">ଓଡ଼ିଆ</option>
      <option value="as">অসমীয়া</option>
      <option value="ur">اردو</option>
      <option value="sat">ᱥᱟᱱᱛᱟᱲ</option>
      <option value="mai">मैथिली</option>
      <option value="gom">कोंकणी</option>
    </select>
  </div>
  <div class="chat-area" id="chat-container">
    <div class="empty-state" id="empty-state">
      <p>🌱 Your personal farming assistant</p>
      <p>Select language, ask a question (or upload a photo)</p>
    </div>
  </div>
  <div class="typing" id="typing-indicator" style="margin: 0 20px 20px;">
    <div class="dot" style="margin-left: 0;"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="input-area" id="input-area">
    <div class="composer-shell">
      <div class="composer-preview" id="preview-container"></div>
      <div class="composer-row">
        <label for="image-input" class="icon-btn attach-btn" title="Attach photo" aria-label="Attach photo">🖼️</label>
        <input type="file" id="image-input" accept="image/*">
        <input type="text" id="user-input" placeholder="Ask a farming question..." autocomplete="off">
        <button class="icon-btn send-btn" id="send-btn" type="button">➤</button>
      </div>
    </div>
  </div>
</div>
<script>
  const BACKEND_URL = 'https://oyster-app-jb6cq.ondigitalocean.app';
  const languageSelect = document.getElementById('language-select');
  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const typingIndicator = document.getElementById('typing-indicator');
  const imageInput = document.getElementById('image-input');
  const previewContainer = document.getElementById('preview-container');
  const emptyState = document.getElementById('empty-state');
  let uploadedImage = null;
  let previewObjectUrl = null;
  let isSending = false;
  let activeRequest = null;
  const SEND_ICON = '➤';
  const STOP_ICON = '■';
  function hideEmptyState() { if (emptyState) emptyState.style.display = 'none'; }
  function setComposerBusy(busy) {
    isSending = busy;
    sendBtn.textContent = busy ? STOP_ICON : SEND_ICON;
    sendBtn.setAttribute('aria-label', busy ? 'Stop generating' : 'Send message');
    sendBtn.title = busy ? 'Stop generating' : 'Send message';
    sendBtn.classList.toggle('is-running', busy);
    imageInput.disabled = busy;
    userInput.disabled = busy;
    previewContainer.classList.toggle('is-running', busy);
    const attachButton = document.querySelector('.attach-btn');
    if (attachButton) attachButton.setAttribute('aria-disabled', String(busy));
  }
  function clearImagePreview() {
    uploadedImage = null;
    imageInput.value = '';
    previewContainer.innerHTML = '';
    if (previewObjectUrl) {
      URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = null;
    }
  }
  function renderImagePreview(file) {
    if (previewObjectUrl) {
      URL.revokeObjectURL(previewObjectUrl);
    }
    previewObjectUrl = URL.createObjectURL(file);
    previewContainer.innerHTML = `
      <div class="image-preview">
        <img src="${previewObjectUrl}" alt="Selected crop photo preview">
        <span class="image-preview-name">${file.name}</span>
        <button type="button" class="remove-preview" aria-label="Remove selected image">×</button>
      </div>
    `;
    previewContainer.querySelector('.remove-preview').addEventListener('click', clearImagePreview);
  }
  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function formatInlineMarkdown(value) {
    return escapeHTML(value).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }
  function renderBotReply(text) {
    const normalized = String(text || '').replace(/\r\n/g, '\n').trim();
    const isFertilizerReply = /\b(fertilizer|fertiliser|urea|dap|npk|mop|manure|compost)\b/i.test(normalized);
    const fertilizerLabels = new Set(['fertilizer', 'fertiliser', 'usage', 'use', 'dose', 'dosage', 'quantity', 'method', 'timing', 'precautions', 'application', 'apply']);
    const lines = normalized.split('\n');
    const blocks = [];
    let listItems = [];

    const flushList = () => {
      if (!listItems.length) return;
      blocks.push(`<ul class="response-list">${listItems.map((item) => `<li>${item}</li>`).join('')}</ul>`);
      listItems = [];
    };

    for (const rawLine of lines) {
      const line = rawLine.trim();
      if (!line) {
        flushList();
        continue;
      }

      const bulletMatch = line.match(/^[-*•]\s+(.*)$/);
      if (bulletMatch) {
        listItems.push(formatInlineMarkdown(bulletMatch[1]));
        continue;
      }

      flushList();

      const labelMatch = line.match(/^([A-Za-z][A-Za-z\s()/+-]{0,30}):\s*(.+)$/);
      if (isFertilizerReply && labelMatch && fertilizerLabels.has(labelMatch[1].trim().toLowerCase())) {
        blocks.push(
          `<div class="fertilizer-row"><span class="fertilizer-label">${escapeHTML(labelMatch[1].trim())}</span><span class="fertilizer-value">${formatInlineMarkdown(labelMatch[2])}</span></div>`
        );
        continue;
      }

      if (/^#{1,3}\s+/.test(line)) {
        blocks.push(`<p class="response-heading">${formatInlineMarkdown(line.replace(/^#{1,3}\s+/, ''))}</p>`);
        continue;
      }

      blocks.push(`<p>${formatInlineMarkdown(line)}</p>`);
    }

    flushList();

    const content = blocks.join('');
    if (isFertilizerReply) {
      return `<div class="fertilizer-card"><div class="fertilizer-chip">Fertilizer guidance</div>${content}</div>`;
    }

    return content;
  }
  function appendMessage(text, sender) {
    hideEmptyState();
    const message = document.createElement('div');
    message.className = `message ${sender === 'user' ? 'user-msg' : 'bot-msg'}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (sender === 'bot') {
      bubble.classList.add('rich-bubble');
      if (String(text || '').trim().startsWith('⚠️')) {
        bubble.classList.add('error-bubble');
      }
      bubble.innerHTML = renderBotReply(text);
    } else {
      bubble.textContent = text;
    }
    message.appendChild(bubble);
    chatContainer.appendChild(message);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }
  function showTyping() { typingIndicator.style.display = 'block'; }
  function hideTyping() { typingIndicator.style.display = 'none'; }
  async function readBackendResponse(response) {
    const contentType = response.headers.get('content-type') || '';
    let payload = null;

    if (contentType.includes('application/json')) {
      payload = await response.json();
    } else {
      const text = await response.text();
      payload = { detail: text };
    }

    if (!response.ok) {
      throw new Error(payload.detail || payload.error || payload.message || `Request failed (${response.status})`);
    }

    return payload;
  }
  async function sendMessage() {
    if (isSending) {
      if (activeRequest) activeRequest.abort();
      return;
    }
    const messageText = userInput.value.trim();
    if (!messageText && !uploadedImage) return;
    appendMessage(messageText || 'Uploaded image', 'user');
    userInput.value = '';
    setComposerBusy(true);
    showTyping();
    activeRequest = new AbortController();
    try {
      let response;
      if (uploadedImage) {
        const formData = new FormData();
        formData.append('prompt', messageText);
        formData.append('language', languageSelect.value);
        formData.append('image', uploadedImage);
        response = await fetch(`${BACKEND_URL}/chat/image`, { method: 'POST', body: formData, signal: activeRequest.signal });
      } else {
        response = await fetch(`${BACKEND_URL}/chat/text`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: messageText, language: languageSelect.value }),
          signal: activeRequest.signal
        });
      }
      const data = await readBackendResponse(response);
      hideTyping();
      const reply = data.response || data.response_text || data.message;
      if (reply) appendMessage(reply, 'bot');
      else throw new Error('No response received from the server.');
      clearImagePreview();
    } catch (err) {
      hideTyping();
      if (err.name === 'AbortError') {
        appendMessage('Generation stopped.', 'bot');
      } else {
        appendMessage(`⚠️ ${err.message || 'Connection error. Check your internet.'}`, 'bot');
      }
    } finally {
      activeRequest = null;
      setComposerBusy(false);
    }
  }
  imageInput.addEventListener('change', () => {
    const file = imageInput.files && imageInput.files[0];
    if (!file) {
      clearImagePreview();
      return;
    }
    uploadedImage = file;
    renderImagePreview(file);
  });
  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  setComposerBusy(false);
</script>
<script src="../site.js"></script>
</body>
</html>
