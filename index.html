<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Krishi Sahayak – AI Farming Advisor</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f7f7f8;
      color: #1e1e1e;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .app {
      width: 100%;
      max-width: 768px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      position: relative;
    }
    /* Header */
    .header {
      background: white;
      border-bottom: 1px solid #e5e5e5;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #0d6b1c;
    }
    .header .badge {
      background: #0d6b1c;
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    /* Language bar */
    .lang-bar {
      display: flex;
      align-items: center;
      padding: 8px 20px;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }
    .lang-bar select {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 0.95rem;
      background: white;
      outline: none;
    }
    /* Chat area */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform: translateY(5px); } to { opacity:1; transform: translateY(0); } }
    .user-msg {
      align-self: flex-end;
      align-items: flex-end;
    }
    .bot-msg {
      align-self: flex-start;
      align-items: flex-start;
    }
    .message .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      word-wrap: break-word;
      font-size: 0.95rem;
    }
    .user-msg .bubble {
      background: #dcf8c6;
      border-bottom-right-radius: 4px;
    }
    .bot-msg .bubble {
      background: #f1f1f1;
      border-bottom-left-radius: 4px;
    }
    /* Image inside message */
    .msg-image {
      max-width: 200px;
      border-radius: 12px;
      margin-bottom: 6px;
      border: 1px solid #ddd;
    }
    /* Typing indicator */
    .typing {
      align-self: flex-start;
      display: none;
      padding: 12px 16px;
      background: #f1f1f1;
      border-radius: 18px;
    }
    .typing .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #888;
      border-radius: 50%;
      margin: 0 3px;
      animation: bounce 1.4s infinite both;
    }
    .typing .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    /* Fertilizer suggestion box */
    .suggestion-box {
      background: #f0fdf4;
      border-left: 4px solid #22c55e;
      padding: 10px 14px;
      border-radius: 8px;
      margin: 10px 0;
    }
    /* Input area */
    .input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: white;
      border-top: 1px solid #e5e5e5;
    }
    .input-area input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid #d1d5db;
      font-size: 1rem;
      outline: none;
      background: #fafafa;
    }
    .icon-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
      color: #555;
    }
    .icon-btn:hover { background: #f0f0f0; }
    .send-btn {
      background: #0d6b1c;
      color: white;
      width: 44px;
      height: 44px;
    }
    .send-btn:hover { background: #0a5a18; }
    /* Hidden file input */
    #image-input { display: none; }
    /* Image preview thumbnail (floating near input) */
    .image-preview {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f0f0f0;
      padding: 6px 10px;
      border-radius: 20px;
      margin-right: 5px;
    }
    .image-preview img {
      height: 36px;
      width: 36px;
      object-fit: cover;
      border-radius: 8px;
    }
    .image-preview .remove-preview {
      cursor: pointer;
      font-size: 1rem;
      color: #999;
      margin-left: 4px;
    }
    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #9ca3af;
      text-align: center;
      gap: 8px;
    }
    .empty-state p { margin: 0; font-size: 0.95rem; }
    @media (max-width: 480px) {
      .header-title h1 { font-size: 1rem; }
      .message { max-width: 85%; }
      .input-area { padding: 10px; gap: 6px; }
      .input-area input[type="text"] { padding: 10px 14px; font-size: 0.95rem; }
      .icon-btn { width: 38px; height: 38px; font-size: 1.3rem; }
      .send-btn { width: 40px; height: 40px; }
      .lang-bar select { padding: 8px 12px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <span>🌾</span>
      <h1>Krishi Sahayak</h1>
      <span class="badge">AI</span>
    </div>
  </div>

  <!-- Language selector -->
  <div class="lang-bar">
    <select id="language-select">
      <option value="hi">हिन्दी</option>
      <option value="bn">বাংলা</option>
      <option value="te" selected>తెలుగు</option>
      <option value="ta">தமிழ்</option>
      <option value="mr">मराठी</option>
      <option value="gu">ગુજરાતી</option>
      <option value="kn">ಕನ್ನಡ</option>
      <option value="ml">മലയാളം</option>
      <option value="pa">ਪੰਜਾਬੀ</option>
      <option value="or">ଓଡ଼ିଆ</option>
      <option value="as">অসমীয়া</option>
      <option value="ur">اردو</option>
      <option value="sat">ᱥᱟᱱᱛᱟᱲ</option>
      <option value="mai">मैथिली</option>
      <option value="gom">कोंकणी</option>
    </select>
  </div>

  <!-- Chat area -->
  <div class="chat" id="chat-container">
    <div class="empty-state" id="empty-state">
      <p>🌱 Your personal farming assistant</p>
      <p>Select language, ask a question (or upload a photo)</p>
    </div>
  </div>

  <!-- Typing indicator -->
  <div class="typing" id="typing-indicator">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <!-- Input area -->
  <div class="input-area" id="input-area">
    <label for="image-input" class="icon-btn" title="Attach photo">🖼️</label>
    <input type="file" id="image-input" accept="image/*">
    <div id="preview-container"></div>
    <input type="text" id="user-input" placeholder="Ask a farming question..." autocomplete="off">
    <button class="icon-btn send-btn" id="send-btn">➤</button>
  </div>
</div>

<script>
  const BACKEND_URL = 'https://oyster-app-jb6cq.ondigitalocean.app';
  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const imageInput = document.getElementById('image-input');
  const previewContainer = document.getElementById('preview-container');
  const languageSelect = document.getElementById('language-select');
  const typingIndicator = document.getElementById('typing-indicator');
  const emptyState = document.getElementById('empty-state');

  let selectedImage = null;   // File object
  let imagePreviewUrl = null; // URL for display

  // Remove empty state when messages exist
  function checkEmptyState() {
    if (chatContainer.children.length > 1) {
      if (emptyState) emptyState.style.display = 'none';
    }
  }

  // Scroll to bottom
  function scrollToBottom() {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  // Convert selected file to preview thumbnail
  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    selectedImage = file;
    // Show preview thumbnail
    if (imagePreviewUrl) URL.revokeObjectURL(imagePreviewUrl);
    imagePreviewUrl = URL.createObjectURL(file);
    previewContainer.innerHTML = `
      <div class="image-preview">
        <img src="${imagePreviewUrl}" alt="Preview">
        <span>Photo ready</span>
        <span class="remove-preview" id="remove-preview">✕</span>
      </div>`;
    document.getElementById('remove-preview').addEventListener('click', clearImageSelection);
  });

  function clearImageSelection() {
    selectedImage = null;
    imagePreviewUrl = null;
    imageInput.value = '';
    previewContainer.innerHTML = '';
  }

  // Simple Markdown to HTML converter
  function formatBotResponse(text) {
    // Bold: **text**
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Bullet points: lines starting with * or -
    text = text.replace(/^(\*|-)\s+(.*)/gm, '<li>$2</li>');
    // Wrap consecutive <li> in <ul>
    text = text.replace(/((?:<li>.*<\/li>\s*)+)/g, '<ul>$1</ul>');
    // Double line breaks to paragraphs
    text = text.replace(/\n\n/g, '</p><p>');
    text = '<p>' + text + '</p>';
    // Remove empty <p></p>
    text = text.replace(/<p>\s*<\/p>/g, '');
    return text;
  }

  // Auto-detect and wrap fertilizer/treatment suggestions in a box
  function wrapSuggestionBoxes(html) {
    // If the text contains typical fertilizer keywords, wrap it
    if (/(fertilizer|kg|NPK|urea|compost|manure|potash|spray|neem oil)/i.test(html)) {
      // We'll wrap the entire bot message in a suggestion box if it seems like a direct recommendation
      // But better to just wrap parts that look like a list of fertilizers.
      // For simplicity, we'll wrap any <ul> that follows a heading or sentence with those keywords.
      // Actually, we'll just add a special class to the bubble if the message contains fertilizer keywords.
      return html; // We'll instead apply a class later from the JS
    }
    return html;
  }

  // Append message to chat
  function appendMessage(text, role, imageUrl = null) {
    checkEmptyState();
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${role}-msg`;

    // Image (user message)
    if (imageUrl) {
      const img = document.createElement('img');
      img.src = imageUrl;
      img.className = 'msg-image';
      msgDiv.appendChild(img);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (role === 'bot') {
      // Format bot response
      const formatted = formatBotResponse(text);
      bubble.innerHTML = formatted;
      // Check if fertilizer suggestion keywords present -> add box style
      if (/(Fertilizer|NPK|kg|urea|spray|organic|pesticide)/i.test(text)) {
        bubble.classList.add('suggestion-box');
      }
    } else {
      bubble.textContent = text;
    }

    msgDiv.appendChild(bubble);
    chatContainer.appendChild(msgDiv);
    scrollToBottom();
  }

  // Show/hide typing
  function showTyping() { typingIndicator.style.display = 'flex'; scrollToBottom(); }
  function hideTyping() { typingIndicator.style.display = 'none'; }

  // Send message
  async function sendMessage() {
    const messageText = userInput.value.trim();
    if (!messageText && !selectedImage) return;

    const language = languageSelect.value;
    // Display user message immediately
    appendMessage(messageText || ' ', 'user', imagePreviewUrl);

    userInput.value = '';
    // Clear image selection
    const currentImage = selectedImage;
    const currentPreviewUrl = imagePreviewUrl;
    clearImageSelection();

    showTyping();

    try {
      let response;
      if (currentImage) {
        const formData = new FormData();
        formData.append('prompt', messageText || 'What is wrong with this crop?');
        formData.append('language', language);
        formData.append('image', currentImage);
        response = await fetch(`${BACKEND_URL}/chat/image`, { method: 'POST', body: formData });
      } else {
        response = await fetch(`${BACKEND_URL}/chat/text`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: messageText, language })
        });
      }
      const data = await response.json();
      hideTyping();
      if (data.response) {
        appendMessage(data.response, 'bot');
      } else {
        appendMessage('⚠️ No response received. Try again.', 'bot');
      }
    } catch (err) {
      hideTyping();
      appendMessage('⚠️ Connection error. Check your internet.', 'bot');
    }
  }

  // Event listeners
  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
