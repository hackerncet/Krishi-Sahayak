<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Krishi Sahayak – AI Farming Advisor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1e1e2e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .app {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #181825;
      border-radius: 0;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
      overflow: hidden;
    }
    .header {
      padding: 16px 20px;
      background: #11111b;
      border-bottom: 1px solid #313244;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #cdd6f4;
    }
    .header span {
      background: #a6e3a1;
      color: #11111b;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .language-row {
      display: flex;
      align-items: center;
      padding: 8px 20px;
      background: #1e1e2e;
      border-bottom: 1px solid #313244;
    }
    .language-row select {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      background: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      font-size: 0.9rem;
      outline: none;
    }
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 85%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .user-msg {
      align-self: flex-end;
      align-items: flex-end;
    }
    .bot-msg {
      align-self: flex-start;
      align-items: flex-start;
    }
    .message .text {
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.55;
      word-wrap: break-word;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }
    .user-msg .text {
      background: #89b4fa;
      color: #1e1e2e;
      border-bottom-right-radius: 4px;
    }
    .bot-msg .text {
      background: #313244;
      color: #cdd6f4;
      border-bottom-left-radius: 4px;
    }
    .message .image-preview {
      max-width: 200px;
      border-radius: 12px;
      margin-bottom: 4px;
      border: 1px solid #45475a;
    }
    .typing {
      align-self: flex-start;
      display: flex;
      gap: 6px;
      padding: 12px 16px;
    }
    .typing .dot {
      width: 8px;
      height: 8px;
      background: #585b70;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing .dot:nth-child(1) { animation-delay: -0.16s; }
    .typing .dot:nth-child(2) { animation-delay: -0.08s; }
    .typing .dot:nth-child(3) { animation-delay: 0s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .input-area {
      padding: 16px 20px;
      background: #11111b;
      border-top: 1px solid #313244;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-area input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      background: #313244;
      border: 1px solid #45475a;
      color: #cdd6f4;
      font-size: 1rem;
      outline: none;
    }
    .input-area input[type="text"]::placeholder {
      color: #6c7086;
    }
    .icon-btn {
      background: #313244;
      border: none;
      color: #cdd6f4;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      transition: background 0.2s;
    }
    .icon-btn:hover {
      background: #45475a;
    }
    .icon-btn.send {
      background: #89b4fa;
      color: #1e1e2e;
    }
    .icon-btn.send:hover {
      background: #74c7ec;
    }
    /* Hide file input */
    #image-input {
      display: none;
    }
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #585b70;
      font-size: 0.95rem;
      gap: 10px;
    }
    .empty-state p { margin: 0; }
    .error-message {
      background: #f38ba8;
      color: #1e1e2e;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🌾 Krishi Sahayak</h1>
    <span>AI</span>
  </div>
  <div class="language-row">
    <select id="language-select">
      <option value="hi">हिन्दी (Hindi)</option>
      <option value="bn">বাংলা (Bengali)</option>
      <option value="te">తెలుగు (Telugu)</option>
      <option value="ta">தமிழ் (Tamil)</option>
      <option value="mr">मराठी (Marathi)</option>
      <option value="gu">ગુજરાતી (Gujarati)</option>
      <option value="kn">ಕನ್ನಡ (Kannada)</option>
      <option value="ml">മലയാളം (Malayalam)</option>
      <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
      <option value="or">ଓଡ଼ିଆ (Odia)</option>
      <option value="as">অসমীয়া (Assamese)</option>
      <option value="ur">اردو (Urdu)</option>
    </select>
  </div>
  <div class="chat" id="chat-container">
    <!-- Messages dynamically inserted -->
    <div class="empty-state" id="empty-state">
      <p>🌱 Your personal farming assistant</p>
      <p style="font-size:0.8rem;">Select language & ask anything about crops, pests, soil, or weather.</p>
    </div>
  </div>
  <div class="typing" id="typing-indicator" style="display: none;">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="input-area">
    <label for="image-input" class="icon-btn" title="Upload crop photo">🖼️</label>
    <input type="file" id="image-input" accept="image/*">
    <input type="text" id="user-input" placeholder="Ask a farming question..." autofocus>
    <button class="icon-btn send" id="send-btn">➤</button>
  </div>
</div>

<script>
  const BACKEND_URL = 'https://oyster-app-jb6cq.ondigitalocean.app'; // Your DigitalOcean app
  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const imageInput = document.getElementById('image-input');
  const languageSelect = document.getElementById('language-select');
  const typingIndicator = document.getElementById('typing-indicator');
  let selectedImage = null; // Store selected image file

  // Hide empty state when messages exist
  function toggleEmptyState() {
    const emptyState = document.getElementById('empty-state');
    if (chatContainer.children.length > 1) { // more than empty-state
      if (emptyState) emptyState.style.display = 'none';
    }
  }

  // Append a message to chat
  function appendMessage(text, role, imageUrl = null) {
    toggleEmptyState();
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${role}-msg`;

    if (imageUrl) {
      const img = document.createElement('img');
      img.src = imageUrl;
      img.className = 'image-preview';
      img.alt = 'Uploaded crop photo';
      msgDiv.appendChild(img);
    }

    const textDiv = document.createElement('div');
    textDiv.className = 'text';
    textDiv.textContent = text;
    msgDiv.appendChild(textDiv);

    chatContainer.appendChild(msgDiv);
    scrollToBottom();
  }

  // Show typing indicator
  function showTyping() {
    typingIndicator.style.display = 'flex';
    scrollToBottom();
  }

  function hideTyping() {
    typingIndicator.style.display = 'none';
  }

  function scrollToBottom() {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  // Convert image file to base64 (for sending as JSON)
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Send message (text + optional image)
  async function sendMessage() {
    const messageText = userInput.value.trim();
    if (!messageText && !selectedImage) return;

    const language = languageSelect.value;

    // Show user message in chat
    if (selectedImage) {
      const imageUrl = URL.createObjectURL(selectedImage);
      appendMessage(messageText || ' ', 'user', imageUrl);
    } else {
      appendMessage(messageText, 'user');
    }

    userInput.value = '';
    showTyping();

    try {
      let response;
      
      // If image is attached, we send it as multipart to a dedicated endpoint (to be added)
      if (selectedImage) {
        const formData = new FormData();
        formData.append('prompt', messageText);
        formData.append('language', language);
        formData.append('image', selectedImage);

        // This requires a new backend endpoint: /chat/image
        response = await fetch(`${BACKEND_URL}/chat/image`, {
          method: 'POST',
          body: formData
        });
      } else {
        // Normal text chat
        response = await fetch(`${BACKEND_URL}/chat/text`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: messageText, language: language })
        });
      }

      const data = await response.json();
      hideTyping();
      
      if (data.response) {
        appendMessage(data.response, 'bot');
      } else {
        appendMessage('⚠️ Received empty response. Please try again.', 'bot');
      }
    } catch (error) {
      hideTyping();
      appendMessage('⚠️ Connection error. Please check your internet and try again.', 'bot');
    } finally {
      // Clear selected image
      selectedImage = null;
      imageInput.value = '';
    }
  }

  // Event listeners
  sendBtn.addEventListener('click', sendMessage);
  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  imageInput.addEventListener('change', (e) => {
    selectedImage = e.target.files[0];
    if (selectedImage) {
      // Optional: show a small preview in input area? Not needed, preview appears in chat
    }
  });

  // Click on the image button opens file dialog via label
  // Already wired.
</script>
</body>
</html>
